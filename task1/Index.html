<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>SVM Task Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --navy: #0f1628;
    --navy-mid: #1a2340;
    --accent: #4f9cf9;
    --accent-glow: rgba(79,156,249,0.18);
    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.15);
    --amber: #f59e0b;
    --red: #ef4444;
    --text: #e8edf5;
    --text-muted: #8596b0;
    --card-bg: #161f35;
    --card-border: rgba(79,156,249,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  .header {
    background: linear-gradient(135deg, #1a2340 0%, #0f1628 100%);
    border-bottom: 1px solid var(--card-border);
    padding: 20px 20px 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .logo {
    width: 40px; height: 40px;
    background: var(--accent); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; color: #fff;
    flex-shrink: 0;
  }
  .header-title { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600; }
  .header-sub   { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .date-chip {
    margin-left: auto;
    background: var(--accent-glow); border: 1px solid rgba(79,156,249,0.25);
    color: var(--accent); font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  }

  .member-bar { display: flex; gap: 8px; align-items: center; position: relative; }

  .dropdown-wrap { flex: 1; position: relative; }

  .dropdown-trigger {
    width: 100%;
    background: var(--navy-mid);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .dropdown-trigger.open { border-color: var(--accent); }

  .trigger-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #334, #223);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    transition: background 0.2s;
  }
  .trigger-avatar.filled {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
  }

  .trigger-label {
    flex: 1; font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trigger-label.selected { color: var(--text); }

  .trigger-chevron {
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: var(--text-muted); fill: none;
    transition: transform 0.25s;
  }
  .dropdown-trigger.open .trigger-chevron { transform: rotate(180deg); }

  .dropdown-panel {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: #1b2640;
    border: 1px solid rgba(79,156,249,0.22);
    border-radius: var(--radius-sm);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    max-height: 0; overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.2s ease;
    opacity: 0;
    z-index: 999;
  }
  .dropdown-panel.open {
    max-height: 320px;
    opacity: 1;
    overflow-y: auto;
  }

  .dropdown-panel::-webkit-scrollbar { width: 4px; }
  .dropdown-panel::-webkit-scrollbar-track { background: transparent; }
  .dropdown-panel::-webkit-scrollbar-thumb { background: rgba(79,156,249,0.2); border-radius: 4px; }

  .dropdown-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(79,156,249,0.06);
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .dropdown-option:last-child { border-bottom: none; }
  .dropdown-option:active { background: rgba(79,156,249,0.1); }
  .dropdown-option.active {
    background: rgba(79,156,249,0.1);
  }

  .option-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .option-name {
    flex: 1; font-size: 14px; color: var(--text);
  }
  .option-check {
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: var(--accent); fill: none;
    opacity: 0; transition: opacity 0.15s;
  }
  .dropdown-option.active .option-check { opacity: 1; }

  .av0  { background: linear-gradient(135deg, #4f9cf9, #2563eb); }
  .av1  { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .av2  { background: linear-gradient(135deg, #22c55e, #15803d); }
  .av3  { background: linear-gradient(135deg, #f59e0b, #b45309); }
  .av4  { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .av5  { background: linear-gradient(135deg, #06b6d4, #0e7490); }
  .av6  { background: linear-gradient(135deg, #ec4899, #be185d); }
  .av7  { background: linear-gradient(135deg, #f97316, #c2410c); }
  .av8  { background: linear-gradient(135deg, #a3e635, #4d7c0f); }
  .av9  { background: linear-gradient(135deg, #38bdf8, #0369a1); }
  .av10 { background: linear-gradient(135deg, #c084fc, #7e22ce); }
  .av11 { background: linear-gradient(135deg, #fb7185, #be123c); }

  .load-btn {
    background: var(--accent); color: #fff; border: none;
    font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius-sm);
    cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .load-btn:active { opacity: 0.8; }

  .body { padding: 20px; }

  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 18px;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius-sm); padding: 12px 10px; text-align: center;
  }
  .stat-val {
    font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700;
    margin-bottom: 2px;
  }
  .stat-val.positive { color: var(--green); }
  .stat-val.negative { color: var(--red); }
  .stat-val.neutral  { color: var(--accent); }
  .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }

  .ai-card {
    background: linear-gradient(135deg, #1a2340, #162038);
    border: 1px solid rgba(79,156,249,0.2);
    border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .ai-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), #8b5cf6, var(--accent));
  }
  .ai-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  .ai-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }
  .ai-text { font-size: 13px; line-height: 1.65; color: var(--text-muted); }

  .section { margin-bottom: 24px; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .section-label {
    font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; color: var(--text-muted); text-transform: uppercase;
  }
  .section-count {
    background: var(--navy-mid); color: var(--text-muted);
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  }

  .task-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color 0.2s, opacity 0.3s;
  }
  .task-card.done { opacity: 0.38; border-color: rgba(34,197,94,0.2); }

  .task-icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .task-icon.daily   { background: rgba(79,156,249,0.12); }
  .task-icon.weekly  { background: rgba(139,92,246,0.12); }
  .task-icon.onetime { background: rgba(245,158,11,0.12); }

  .task-info { flex: 1; min-width: 0; }
  .task-name {
    font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 500;
    line-height: 1.3; margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
  .type-pill { padding: 2px 8px; border-radius: 20px; font-weight: 600; font-size: 10px; letter-spacing: 0.04em; }
  .type-pill.daily   { background: rgba(79,156,249,0.15); color: var(--accent); }
  .type-pill.weekly  { background: rgba(139,92,246,0.15); color: #a78bfa; }
  .type-pill.onetime { background: rgba(245,158,11,0.15); color: var(--amber); }
  .task-id-badge { font-size: 10px; color: rgba(133,150,176,0.5); }

  .done-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid rgba(79,156,249,0.3); background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .done-btn svg { width: 16px; height: 16px; stroke: var(--text-muted); transition: stroke 0.2s; }
  .done-btn:active { transform: scale(0.9); }
  .done-btn.spinning { border-color: var(--accent); animation: spin 0.8s linear infinite; }
  .done-btn.completed { border-color: var(--green); background: var(--green-glow); }
  .done-btn.completed svg { stroke: var(--green); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .skeleton {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius); height: 72px; margin-bottom: 10px;
    position: relative; overflow: hidden;
  }
  .skeleton::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .welcome { text-align: center; padding: 60px 24px 40px; }
  .welcome-logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: #fff;
    margin: 0 auto 20px;
  }
  .welcome h2 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .welcome p  { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
  .empty-icon { font-size: 42px; margin-bottom: 12px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy-mid); border: 1px solid var(--card-border);
    color: var(--text); font-size: 13px; font-weight: 500;
    padding: 10px 20px; border-radius: 30px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  .toast.show    { opacity: 1; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error   { border-color: var(--red);   color: var(--red);   }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-top">
    <div class="logo">SVM</div>
    <div>
      <div class="header-title">Task Manager</div>
      <div class="header-sub">Saraswati Vidyamandir</div>
    </div>
    <div class="date-chip" id="todayChip">Today</div>
  </div>

  <!-- Custom dropdown -->
  <div class="member-bar">
    <div class="dropdown-wrap" id="dropdownWrap">

      <!-- Trigger button -->
      <div class="dropdown-trigger" id="dropdownTrigger" onclick="toggleDropdown()">
        <div class="trigger-avatar" id="triggerAvatar">?</div>
        <div class="trigger-label" id="triggerLabel">Select your name…</div>
        <svg class="trigger-chevron" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <!-- Options panel -->
      <div class="dropdown-panel" id="dropdownPanel"></div>
    </div>

    <button class="load-btn" onclick="loadTasks()">View Tasks</button>
  </div>
</div>

<!-- ── Main content ── -->
<div class="body" id="mainBody">
  <div class="welcome">
    <div class="welcome-logo">SVM</div>
    <h2>Welcome!</h2>
    <p>Select your name above to see your tasks for today.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var opts = { weekday: 'short', day: 'numeric', month: 'short' };
  document.getElementById('todayChip').textContent =
    new Date().toLocaleDateString('en-IN', opts);
})();

var AV_COLORS = ['av0','av1','av2','av3','av4','av5','av6','av7','av8','av9','av10','av11'];

var selectedMember = '';
var weeklyScore    = 0;
var sessionDone    = 0;
var dropdownOpen   = false;

var TYPE_MAP = {
  'Daily':    { emoji: '🔄', cls: 'daily' },
  'Weekly':   { emoji: '📅', cls: 'weekly' },
  'One-time': { emoji: '⭐', cls: 'onetime' }
};

google.script.run
  .withSuccessHandler(function(members) {
    var panel = document.getElementById('dropdownPanel');
    panel.innerHTML = '';

    members.forEach(function(m, i) {
      var initials = m.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
      var avClass  = AV_COLORS[i % AV_COLORS.length];

      var opt = document.createElement('div');
      opt.className = 'dropdown-option';
      opt.setAttribute('data-value', m);
      opt.innerHTML =
        '<div class="option-avatar ' + avClass + '">' + initials + '</div>' +
        '<div class="option-name">' + escHtml(m) + '</div>' +
        '<svg class="option-check" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      opt.addEventListener('click', function() { selectMember(m, initials, avClass, i); });
      panel.appendChild(opt);
    });
  })
  .withFailureHandler(function() { showToast('Could not load team list', 'error'); })
  .getTeamMembers();

function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  document.getElementById('dropdownTrigger').classList.toggle('open', dropdownOpen);
  document.getElementById('dropdownPanel').classList.toggle('open', dropdownOpen);
}

document.addEventListener('click', function(e) {
  if (dropdownOpen && !document.getElementById('dropdownWrap').contains(e.target)) {
    dropdownOpen = false;
    document.getElementById('dropdownTrigger').classList.remove('open');
    document.getElementById('dropdownPanel').classList.remove('open');
  }
});

function selectMember(name, initials, avClass, idx) {
  selectedMember = name;

  var avatar = document.getElementById('triggerAvatar');
  avatar.textContent = initials;
  avatar.className   = 'trigger-avatar filled ' + avClass;

  var label = document.getElementById('triggerLabel');
  label.textContent = name;
  label.className   = 'trigger-label selected';

  var opts = document.querySelectorAll('.dropdown-option');
  opts.forEach(function(o) { o.classList.remove('active'); });
  if (opts[idx]) opts[idx].classList.add('active');

  dropdownOpen = false;
  document.getElementById('dropdownTrigger').classList.remove('open');
  document.getElementById('dropdownPanel').classList.remove('open');
}

function loadTasks() {
  if (!selectedMember) { showToast('Please select your name first', 'error'); return; }

  weeklyScore = 0; sessionDone = 0;

  var body = document.getElementById('mainBody');
  body.innerHTML =
    '<div class="skeleton"></div>' +
    '<div class="skeleton" style="height:56px;opacity:.6;margin-top:12px"></div>' +
    '<div class="skeleton" style="height:72px;opacity:.4;margin-top:12px"></div>';

  google.script.run
    .withSuccessHandler(function(data) { renderTasks(data, selectedMember); })
    .withFailureHandler(function() { showToast('Failed to load tasks', 'error'); })
    .getTasksForMember(selectedMember);

  google.script.run
    .withSuccessHandler(function(sc) {
      weeklyScore = sc;
      var el = document.getElementById('weeklyScoreVal');
      if (el) updateScoreEl(el, sc);
    })
    .getWeeklyScore(selectedMember);
}

function renderTasks(data, member) {
  var body     = document.getElementById('mainBody');
  var allTasks = data.recurring.concat(data.onetime);

  if (allTasks.length === 0) {
    body.innerHTML =
      '<div class="empty"><div class="empty-icon">✅</div>' +
      'No pending tasks for today, ' + escHtml(member) + '!<br>Great job!</div>';
    return;
  }

  var total = allTasks.length;
  var html  = '';

  html += '<div class="stats-row">' +
    '<div class="stat-card"><div class="stat-val neutral" id="pendingVal">' + total + '</div><div class="stat-label">Pending</div></div>' +
    '<div class="stat-card"><div class="stat-val positive" id="doneVal">0</div><div class="stat-label">Done Today</div></div>' +
    '<div class="stat-card"><div class="stat-val neutral" id="weeklyScoreVal">…</div><div class="stat-label">Weekly Score</div></div>' +
  '</div>';

  html += '<div class="ai-card">' +
    '<div class="ai-label"><div class="ai-dot"></div>AI Priority Insight</div>' +
    '<div class="ai-text" id="aiText">Analysing your tasks…</div>' +
  '</div>';

  if (data.recurring.length > 0) {
    html += '<div class="section">' +
      '<div class="section-header"><div class="section-label">Recurring Tasks</div>' +
      '<div class="section-count">' + data.recurring.length + '</div></div>' +
      data.recurring.map(taskCard).join('') +
    '</div>';
  }

  if (data.onetime.length > 0) {
    html += '<div class="section">' +
      '<div class="section-header"><div class="section-label">One-Time Tasks</div>' +
      '<div class="section-count">' + data.onetime.length + '</div></div>' +
      data.onetime.map(taskCard).join('') +
    '</div>';
  }

  body.innerHTML = html;

  if (weeklyScore !== 0) {
    var el = document.getElementById('weeklyScoreVal');
    if (el) updateScoreEl(el, weeklyScore);
  }

  google.script.run
    .withSuccessHandler(function(tip) {
      var el = document.getElementById('aiText');
      if (el) el.textContent = tip;
    })
    .withFailureHandler(function() {})
    .getAISuggestion(allTasks);
}

function taskCard(task) {
  var map = TYPE_MAP[task.type] || { emoji: '📌', cls: 'onetime' };
  var cls = map.cls;
  return '<div class="task-card" id="card-' + task.rowIndex + '">' +
    '<div class="task-icon ' + cls + '">' + map.emoji + '</div>' +
    '<div class="task-info">' +
      '<div class="task-name">' + escHtml(task.name) + '</div>' +
      '<div class="task-meta">' +
        '<span class="type-pill ' + cls + '">' + task.type.toUpperCase() + '</span>' +
        (task.taskId ? '<span class="task-id-badge">' + escHtml(task.taskId) + '</span>' : '') +
        (task.plannedDate ? '<span>· Due ' + task.plannedDate + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<button class="done-btn" id="btn-' + task.rowIndex + '" ' +
      'onclick="markDone(' + task.rowIndex + ')" title="Mark as Done">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="20 6 9 17 4 12"/>' +
      '</svg>' +
    '</button>' +
  '</div>';
}

function markDone(rowIndex) {
  var btn  = document.getElementById('btn-'  + rowIndex);
  var card = document.getElementById('card-' + rowIndex);
  if (!btn || btn.classList.contains('completed') || btn.classList.contains('spinning')) return;

  btn.classList.add('spinning');

  google.script.run
    .withSuccessHandler(function(result) {
      btn.classList.remove('spinning');
      btn.classList.add('completed');
      card.classList.add('done');

      sessionDone++;
      weeklyScore += result.score;

      var pendingEl = document.getElementById('pendingVal');
      var doneEl    = document.getElementById('doneVal');
      var scoreEl   = document.getElementById('weeklyScoreVal');

      if (pendingEl) pendingEl.textContent = Math.max(0, parseInt(pendingEl.textContent) - 1);
      if (doneEl)    doneEl.textContent    = sessionDone;
      if (scoreEl)   updateScoreEl(scoreEl, weeklyScore);

      showToast(
        result.score >= 0 ? '✅ Done! +1 to weekly score' : '⚠️ Marked late: -1 to score',
        result.score >= 0 ? 'success' : 'error'
      );
    })
    .withFailureHandler(function() {
      btn.classList.remove('spinning');
      showToast('Update failed — check connection', 'error');
    })
    .markTaskDone(rowIndex);
}

function updateScoreEl(el, sc) {
  el.textContent = (sc > 0 ? '+' : '') + sc;
  el.className = 'stat-val ' + (sc > 0 ? 'positive' : sc < 0 ? 'negative' : 'neutral');
}

var toastTimer;
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.className = 'toast'; }, 2800);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
